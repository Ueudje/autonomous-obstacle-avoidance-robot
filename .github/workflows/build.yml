name: Build

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configure Git User
        run: |
          git config --global user.name "Ueudje"
          git config --global user.email "classlol72@gmail.com"
          
      - name: Random Delay
        run: sleep $((RANDOM % 2700))

      - name: Make Routine Update and Push
        run: |
          # 1. Create or update a hidden log file (does not mess up your main project files)
          echo "Automated routine check: $(date)" >> .github/routine-log.txt
         
          # 2. Stage the changes
          git add .github/routine-log.txt
          
          # 3. Commit the changes using a casual message
          git commit -m "update routine logs"
          
          # 4. Push to your repository
          git push origin main
