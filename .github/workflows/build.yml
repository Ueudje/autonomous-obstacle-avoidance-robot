name: Build

on:
  schedule:
    # Runs daily at 09:00 AM UTC
    - cron: '0 9 * * *'
  # Allows manual triggering from the GitHub Actions UI anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git User
        run: |
          git config --global user.name "YourGitHubUsername"
          git config --global user.email "your-email@example.com"
          
      # Adds a random delay (0-45 mins) so commits do not happen at the exact same minute daily
      - name: Random Delay
        run: sleep $((RANDOM % 2700))

      - name: Make Human-Like Update
        run: |
          # 1. Arrays of casual, realistic commit messages and engineering notes
          COMMITS=("update docs" "minor refactoring" "fix typo" "cleanup whitespace" "adjust sensor config notes" "wip: motor testing" "review pin mapping" "format text" "update scratchpad")
          NOTES=("double check L293D current limits" "verify FC-51 infrared range" "review Arduino Uno memory usage" "test battery load on DC motors" "calibrate obstacle avoidance threshold" "organize cable management thoughts" "review H-bridge polarity")
          
          # 2. Select one random commit message and one random note
          RANDOM_COMMIT=${COMMITS[$RANDOM % ${#COMMITS[@]}]}
          RANDOM_NOTE=${NOTES[$RANDOM % ${#NOTES[@]}]}
          
          # 3. Append the realistic note to a developer scratchpad file
          mkdir -p docs
          echo "- $RANDOM_NOTE" >> docs/dev-scratchpad.md
          
          # 4. Stage, commit, and push
          git add docs/dev-scratchpad.md
          git commit -m "$RANDOM_COMMIT"
          git push origin main
